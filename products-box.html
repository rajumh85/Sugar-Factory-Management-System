<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Product | SugarGreen</title>
  <style>
    body { font-family: Arial; background: #f0fff0; margin: 0; }
    header {
      background-color: #a5d6a7;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 24px; font-family: 'Pacifico', cursive; color: #2e7d32; }
    nav a { margin-left: 20px; text-decoration: none; color: #2e7d32; font-weight: bold; }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { color: #2e7d32; text-align: center; }
    label {
      display: block; margin-top: 15px;
      font-weight: bold; color: #2e7d32;
    }
    input, textarea {
      width: 100%; padding: 10px;
      border-radius: 6px; border: 1px solid #ccc;
      margin-top: 5px;
    }
    button {
      background: #388e3c;
      color: white; width: 100%;
      padding: 12px; border: none;
      border-radius: 8px; font-size: 16px;
      margin-top: 25px; cursor: pointer;
    }
    button:hover { background: #2e7d32; }
  </style>
</head>
<body>

<header>
  <div class="logo">🌿 SugarGreen</div>
  <nav>
    <a href="admin.html">Back to Dashboard</a>
    <a href="login.html">Logout</a>
  </nav>
</header>

<div class="container">
  <h2>Add Product</h2>
  <form action="store_product.php" method="POST">
    <label for="name">Product Name:</label>
    <input type="text" name="name" required>

    <label for="price">Price (₹):</label>
    <input type="number" step="0.01" name="price" required>

    <label for="image_url">Image URL:</label>
    <input type="text" name="image_url">

    <label for="description">Description:</label>
    <textarea name="description" rows="3" required></textarea>

    <button type="submit">Add Product</button>
  </form>
</div>

</body>
</html>
